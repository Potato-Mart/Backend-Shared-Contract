name: Test Contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release alignment
        shell: pwsh
        run: ./scripts/powershell/Test-ReleaseAlignment.ps1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Test contracts
        env:
          GOWORK: off
        run: go test ./...
