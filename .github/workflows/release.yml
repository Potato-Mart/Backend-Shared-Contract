name: Release Contract

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Source version to repair or publish; defaults to ModuleVersion"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: contract-release
  cancel-in-progress: false

jobs:
  release:
    name: Ensure aligned tag and GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $versions = @(& ./scripts/Test-ReleaseAlignment.ps1 -PassThru)
          if ($LASTEXITCODE -ne 0 -or $versions.Count -ne 1) {
              throw "Could not resolve exactly one aligned source version."
          }

          $sourceVersion = $versions[0].Trim()
          if (
              $env:EVENT_NAME -eq 'workflow_dispatch' -and
              ($env:REF_TYPE -ne 'branch' -or $env:REF_NAME -ne 'main')
          ) {
              throw "Manual release repair must run from the main branch."
          }

          $requestedVersion = $sourceVersion
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:REQUESTED_VERSION) {
              $requestedVersion = $env:REQUESTED_VERSION
          }

          if ($requestedVersion -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Requested version '$requestedVersion' is not valid release semver."
          }
          if ($requestedVersion -ne $sourceVersion) {
              throw "Requested version '$requestedVersion' does not match source ModuleVersion '$sourceVersion'."
          }

          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$sourceVersion"

      - name: Test contracts
        env:
          GOWORK: off
        run: go test ./...

      - name: Ensure immutable annotated version tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          & git fetch --force --tags origin
          if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch remote release tags."
          }

          & git rev-parse --verify --quiet "refs/tags/$env:VERSION^{commit}" *> $null
          if ($LASTEXITCODE -eq 0) {
              & ./scripts/Test-ReleaseAlignment.ps1 -ExpectedVersion $env:VERSION -RequireTag
              exit 0
          }

          & git config user.name 'github-actions[bot]'
          & git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          & git tag -a $env:VERSION -m "Release $env:VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not create annotated tag '$env:VERSION'."
          }

          & git push origin "refs/tags/$env:VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not publish annotated tag '$env:VERSION'."
          }

          & ./scripts/Test-ReleaseAlignment.ps1 -ExpectedVersion $env:VERSION -RequireTag

      - name: Ensure published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $isPrerelease = $env:VERSION.Contains('-')
          $releaseJson = & gh release view $env:VERSION --json tagName,name,isDraft,isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
              $release = $releaseJson | ConvertFrom-Json
              if ($release.tagName -ne $env:VERSION) {
                  throw "GitHub Release tag '$($release.tagName)' does not match '$env:VERSION'."
              }

              $needsRepair = (
                  $release.name -ne $env:VERSION -or
                  $release.isDraft -or
                  $release.isPrerelease -ne $isPrerelease
              )
              if ($needsRepair) {
                  & gh release edit $env:VERSION `
                      --title $env:VERSION `
                      --draft=false `
                      "--prerelease=$($isPrerelease.ToString().ToLowerInvariant())"
                  if ($LASTEXITCODE -ne 0) {
                      throw "Could not repair GitHub Release metadata for '$env:VERSION'."
                  }
              }
              else {
                  Write-Host "GitHub Release '$env:VERSION' is already aligned."
              }
              exit 0
          }

          $releaseNotes = Get-Content -LiteralPath RELEASE_NOTES.md -Raw
          $escapedVersion = [regex]::Escape($env:VERSION)
          $sectionPattern = "(?ms)^##\s+$escapedVersion[^\r\n]*\r?\n.*?(?=^##\s+v\d+\.\d+\.\d+|\z)"
          $section = [regex]::Match($releaseNotes, $sectionPattern)
          if (-not $section.Success) {
              throw "Could not extract release notes for '$env:VERSION'."
          }
          Set-Content -LiteralPath release-notes.md -Value $section.Value.TrimEnd() -Encoding utf8

          $createArgs = @(
              'release',
              'create',
              $env:VERSION,
              '--verify-tag',
              '--title',
              $env:VERSION,
              '--notes-file',
              'release-notes.md'
          )
          if ($isPrerelease) {
              $createArgs += '--prerelease'
          }

          & gh @createArgs
          if ($LASTEXITCODE -ne 0) {
              throw "Could not create GitHub Release '$env:VERSION'."
          }
