name: Release Contract

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to release, for example v3.0.0"
        required: true
        type: string
      draft:
        description: "Create release as draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean
      use_ai_notes:
        description: "Use Copilot to polish release notes when GH_COPILOT_TOKEN is configured"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build release notes and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.ref_name }}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '$version' is not valid semver. Expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout requested tag for manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          git rev-parse --verify "refs/tags/${{ steps.version.outputs.version }}"
          git checkout "${{ steps.version.outputs.version }}"

      - name: Generate release notes
        shell: bash
        run: bash scripts/get-contract-release-notes.sh --version "${{ steps.version.outputs.version }}" --output release-notes.md

      - name: Get Copilot token
        id: copilot_token
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_ai_notes == true }}
        env:
          GH_PAT: ${{ secrets.GH_PAT_FOR_COPILOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GH_PAT" ]]; then
            echo "GH_PAT_FOR_COPILOT is not configured; skipping Copilot token exchange."
            exit 0
          fi

          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/json" \
            https://api.github.com/copilot_internal/v2/token)

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)

          if [[ "$http_code" != "200" ]]; then
            echo "Failed to get Copilot token (HTTP $http_code): $body" >&2
            exit 1
          fi

          token=$(echo "$body" | jq -r '.token')

          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "Copilot token was empty in response: $body" >&2
            exit 1
          fi

          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Polish release notes with Copilot
        if: ${{ steps.copilot_token.outputs.token != '' }}
        env:
          GH_COPILOT_TOKEN: ${{ steps.copilot_token.outputs.token }}
          USE_AI_NOTES: ${{ github.event_name != 'workflow_dispatch' || inputs.use_ai_notes }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$USE_AI_NOTES" != "true" ]]; then
            echo "AI release notes disabled; keeping deterministic notes."
            exit 0
          fi

          bash scripts/get-ai-contract-release-notes.sh \
            --version "${{ steps.version.outputs.version }}" \
            --input release-notes.md \
            --output release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.version.outputs.version, '-') }}
        shell: bash
        run: |
          set -euo pipefail

          release_args=(--title "$VERSION" --notes-file release-notes.md)

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" "${release_args[@]}"
          else
            create_args=("$VERSION" "${release_args[@]}")

            if [[ "$DRAFT" == "true" ]]; then
              create_args+=(--draft)
            fi

            if [[ "$PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi

            gh release create "${create_args[@]}"
          fi