name: Release Contract

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to release, for example v3.0.0"
        required: true
        type: string
      draft:
        description: "Create release as draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build release notes and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.ref_name }}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '$version' is not valid semver. Expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Checkout requested tag for manual release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          git rev-parse --verify "refs/tags/${{ steps.version.outputs.version }}"
          git checkout "${{ steps.version.outputs.version }}"

      - name: Test contracts
        env:
          GOWORK: off
        run: go test ./...

      - name: Generate release notes from commit messages
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"

          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..HEAD"
          else
            range="HEAD"
          fi

          {
            echo "## $version"
            echo ""
            git log --no-merges --pretty=format:"- %s (%h)" "$range"
            echo ""
          } > release-notes.md

          echo "Generated release notes:"
          cat release-notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.version.outputs.version, '-') }}
        shell: bash
        run: |
          set -euo pipefail

          release_args=(--title "$VERSION" --notes-file release-notes.md)

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" "${release_args[@]}"
          else
            create_args=("$VERSION" "${release_args[@]}")

            if [[ "$DRAFT" == "true" ]]; then
              create_args+=(--draft)
            fi

            if [[ "$PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi

            gh release create "${create_args[@]}"
          fi
